// Modified by mqmqgo, 2026-09-25: removed vendor jars and androidx.biometric
apply plugin: 'com.android.library'

android {
    namespace 'com.wei.android.lib.fingerprintidentify'

    compileSdk 34
    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }
    android {
        lintOptions {
            abortOnError false
        }
    }
}

dependencies {
    // Hardened fork: vendor SDK jars (Samsung Pass / MeiZu) and androidx.biometric removed.
    // Only framework FingerprintManager (API 23-29) and framework BiometricPrompt (API 30+) are used.
    implementation 'androidx.appcompat:appcompat:1.0.2'
}
